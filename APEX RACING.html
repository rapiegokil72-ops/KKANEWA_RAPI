<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APEX RACING</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#090a0c;--pan:rgba(15,17,21,.94);--ln:#2a2e36;--ch:#c9d0da;--mut:#858d9a;--sig:#ff5a1f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#eef2f7;font:400 15px/1.45 Barlow,system-ui,sans-serif;user-select:none;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.scr,.hud{position:fixed;inset:0;display:none}
.scr.on,.hud.on{display:flex}
.scr{align-items:center;justify-content:center;padding:20px;background:linear-gradient(90deg,rgba(9,10,12,.9),rgba(9,10,12,.25) 65%,transparent)}
.scr.dim{background:rgba(0,0,0,.6)}
#s-menu{justify-content:flex-start;padding-left:8vw}
.card{background:var(--pan);border:1px solid var(--ln);border-left:3px solid var(--sig);padding:24px;width:min(560px,100%);max-height:100%;overflow:auto}
h1{font:800 clamp(60px,12vw,128px)/.82 'Barlow Condensed',sans-serif;margin-bottom:10px}
h1 span{display:block;color:var(--sig)}
h2{font:800 34px/1 'Barlow Condensed',sans-serif;margin-bottom:16px}
.meta{color:var(--mut);font-size:14px;margin:0 0 16px}
button{font:600 17px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#eef2f7;background:#171a1f;border:1px solid var(--ln);padding:10px 16px;cursor:pointer;border-radius:2px;touch-action:manipulation}
button:hover,button:focus-visible{border-color:var(--ch);outline:none}
button.pri,button.on{background:var(--sig);border-color:var(--sig);color:#110a06}
button:disabled{opacity:.4;cursor:default}
.menu{display:grid;gap:8px;width:min(330px,90vw)}
.menu button{text-align:left;font-size:19px;padding:12px 18px}
.menu .pri{text-align:center}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln)}
.row .g{flex:1;min-width:0}
.row b{font:800 20px 'Barlow Condensed',sans-serif;display:block}
.row small{color:var(--mut)}
.stat{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin-top:3px}
.stat span{width:76px}
.bar{flex:1;height:5px;background:#252930}
.bar i{display:block;height:100%;background:var(--ch)}
.pips{display:flex;gap:4px}
.pips i{width:14px;height:8px;background:#252930}
.pips i.f{background:var(--sig)}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.swatch{width:40px;height:40px;padding:0;border-radius:50%;border:2px solid transparent}
.swatch.sel{border-color:#fff}
.back{margin-top:16px}
.note{color:var(--sig);min-height:20px;margin-top:8px;font-size:14px}
.hud{pointer-events:none}
.hud>*{position:absolute}
.hud .pad,.hud button{pointer-events:auto}
#tiles{left:16px;top:14px;display:flex;gap:8px}
.tile{background:rgba(9,10,12,.72);border-left:3px solid var(--sig);padding:5px 12px;min-width:92px}
.tile small{display:block;font:600 11px Barlow,sans-serif;letter-spacing:.14em;color:var(--mut)}
.tile span{font:800 28px/1 'Barlow Condensed',sans-serif}
#mini{right:16px;top:14px;width:170px;height:170px;background:rgba(9,10,12,.6);border:1px solid var(--ln)}
#spd{right:16px;top:196px;text-align:right}
#kmh{font:800 76px/.9 'Barlow Condensed',sans-serif;display:block}
#spd small{color:var(--mut);letter-spacing:.14em}
#tw{left:16px;top:96px;width:200px}
#tw small{font:600 11px Barlow,sans-serif;letter-spacing:.14em;color:var(--mut)}
#turbo{height:8px;background:#252930;margin-top:4px}
#turbo i{display:block;height:100%;width:100%;background:var(--sig)}
#pauseBtn{left:50%;top:14px;transform:translateX(-50%);padding:8px 16px}
#cnt{left:0;right:0;top:30%;text-align:center;font:800 150px/1 'Barlow Condensed',sans-serif;text-shadow:0 4px 30px #000}
#toast{left:0;right:0;top:18%;text-align:center;font:800 40px 'Barlow Condensed',sans-serif;opacity:0;transition:opacity .3s;text-shadow:0 2px 16px #000}
#toast.show{opacity:1}
#camLbl{left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;color:var(--mut);white-space:nowrap}
.pad{position:absolute;bottom:16px;display:none;gap:8px}
.pad button{width:78px;height:78px;border-radius:50%;padding:0;background:rgba(18,20,25,.8);font-size:15px}
#padL{left:16px}
#padR{right:16px}
@media (pointer:coarse){.pad{display:grid;grid-template-columns:repeat(2,78px)}}
</style>
</head>
<body>
<div id="stage"></div>

<section class="scr on" id="s-menu"><div>
<h1>APEX<span>RACING</span></h1>
<p class="meta" id="meta"></p>
<nav class="menu">
<button class="pri" data-act="play">PLAY</button>
<button data-act="career">CAREER MODE</button>
<button data-view="vehicles">VEHICLE SELECTION</button>
<button data-view="garage">GARAGE</button>
<button data-view="tracks">TRACK SELECTION</button>
<button data-view="upgrades">UPGRADES</button>
<button data-view="graphics">GRAPHICS SETTINGS</button>
</nav>
</div></section>

<section class="scr" id="s-vehicles"><div class="card"><h2>VEHICLE SELECTION</h2><div id="vBody"></div><button class="back" data-view="menu">BACK</button></div></section>
<section class="scr" id="s-garage"><div class="card"><h2>GARAGE</h2><div id="gBody"></div><button class="back" data-view="menu">BACK</button></div></section>
<section class="scr" id="s-tracks"><div class="card"><h2>TRACK SELECTION</h2><div id="tBody"></div><button class="back" data-view="menu">BACK</button></div></section>
<section class="scr" id="s-upgrades"><div class="card"><h2>UPGRADES</h2><p class="meta" id="uCr"></p><div id="uBody"></div><p class="note" id="uNote"></p><button class="back" data-view="menu">BACK</button></div></section>
<section class="scr" id="s-graphics"><div class="card"><h2>GRAPHICS SETTINGS</h2><div id="gfxBody"></div><button class="back" data-view="menu">BACK</button></div></section>

<section class="scr dim" id="s-pause"><div class="card"><h2>PAUSED</h2><div class="menu">
<button class="pri" data-act="resume">RESUME</button>
<button data-act="restart">RESTART</button>
<button data-act="quit">QUIT TO MENU</button>
</div></div></section>

<section class="scr dim" id="s-results"><div class="card"><h2 id="resTitle"></h2><div class="meta" id="resBody"></div><div class="menu">
<button class="pri" data-act="restart">RACE AGAIN</button>
<button data-act="quit">MAIN MENU</button>
</div></div></section>

<div class="hud" id="hud">
<div id="tiles">
<div class="tile"><small>POSITION</small><span id="hPos">1/4</span></div>
<div class="tile"><small>LAP</small><span id="hLap">1/3</span></div>
<div class="tile"><small>TIME</small><span id="hTime">00:00.00</span></div>
</div>
<canvas id="mini" width="170" height="170"></canvas>
<div id="spd"><span id="kmh">0</span><small>KM/H</small><div>GEAR <b id="gear">1</b></div></div>
<div id="tw"><small>TURBO</small><div id="turbo"><i></i></div></div>
<button id="pauseBtn" data-act="pause">PAUSE</button>
<div id="cnt"></div>
<div id="toast"></div>
<div id="camLbl"></div>
<div class="pad" id="padL"><button data-hold="left">&#9664;</button><button data-hold="right">&#9654;</button></div>
<div class="pad" id="padR"><button data-hold="turbo">TURBO</button><button data-hold="hand">HAND</button><button data-hold="brake">BRAKE</button><button data-hold="gas">GAS</button></div>
</div>

<script>
(function(){
'use strict';
if(typeof THREE==='undefined'){document.body.innerHTML='<p style="padding:32px">Gagal memuat Three.js. Periksa koneksi internet lalu muat ulang.</p>';return;}

const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrap=a=>((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
const hex=c=>'#'+c.toString(16).padStart(6,'0');
const fmt=t=>{const m=Math.floor(t/60),s=t-m*60;return String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0');};
const set=(sel,t)=>{const el=$(sel),s=String(t);if(el&&el.textContent!==s)el.textContent=s;};

const LAPS=3,MS=600,HW=8,PRIZES=[2000,1200,700,350],UMAX=5;
const CARS=[
{n:'RAGNO SV',t:'Supercar',c:0x1d6fd8,s:[1.9,.6,4.5],a:6,v:8,h:6,b:7},
{n:'CAVALLO 12',t:'Grand Tourer',c:0xd42a2a,s:[2,.7,4.8],a:5,v:9,h:6,b:6},
{n:'FALCON GT3',t:'Race Car',c:0xf2c230,s:[1.9,.55,4.2],a:7,v:7,h:8,b:8},
{n:'VELOX HX',t:'Hypercar',c:0x7a2cd0,s:[2,.55,4.6],a:8,v:9,h:7,b:8},
{n:'SAMURAI R35',t:'AWD Sports',c:0xe8e8ec,s:[1.9,.65,4.5],a:7,v:7,h:9,b:7},
{n:'TITANO 16',t:'Hypercar',c:0x16a88a,s:[2.1,.5,4.8],a:9,v:10,h:4,b:9}];
const PAINTS=[0x1d6fd8,0xd42a2a,0xf2c230,0x7a2cd0,0xe8e8ec,0x16a88a,0x111111,0x2e8b57];
const RIMS=[0xc9d0da,0xd4a23a,0x333840];
const UPG=[['engine','ENGINE POWER'],['top','TOP SPEED'],['turbo','TURBO'],['steer','STEERING'],['grip','TIRE GRIP'],['brakes','BRAKES']];
const TRACKS=[
{n:'Coastal Grand Prix',d:'Seaside circuit',k:2,a:.18,b:.08,p:1,q:.4,rx:270,rz:200,env:'coast',sky:0x8fd0f5,gnd:0x2f86b8,fog:0xbfe6ff,road:0x3a3d44},
{n:'Alpine Ring',d:'Mountain switchbacks',k:3,a:.2,b:.11,p:.3,q:2.1,rx:230,rz:210,env:'alpine',sky:0xa9c5e3,gnd:0x4d7a3b,fog:0xd3e2ef,road:0x3a3d44},
{n:'Neon City Circuit',d:'Futuristic night city',k:4,a:.1,b:.05,p:0,q:1,rx:210,rz:210,env:'neon',sky:0x07050f,gnd:0x15112a,fog:0x0d0a1f,road:0x1a1a24},
{n:'Desert Speedway',d:'Open desert straights',k:2,a:.2,b:.1,p:2.4,q:1,rx:300,rz:230,env:'desert',sky:0xf2c08a,gnd:0xd8a25e,fog:0xf3cb9c,road:0x4a4540}];
const PRE={LOW:{res:50,sh:0,aa:0,far:0},MEDIUM:{res:75,sh:1,aa:1,far:1},HIGH:{res:100,sh:1,aa:1,far:1}};

/* ---------- save data ---------- */
const KEY='apex_racing_v1';
const DEF={credits:800,wins:0,career:0,car:0,paint:0,rims:0,track:0,up:{},sound:'ON',gfx:{preset:'MEDIUM',res:75,sh:1,aa:1,far:1}};
let S=JSON.parse(JSON.stringify(DEF));
try{
  const r=JSON.parse(localStorage.getItem(KEY)||'null');
  if(r&&typeof r==='object'){S=Object.assign({},DEF,r);S.up=Object.assign({},r.up);S.gfx=Object.assign({},DEF.gfx,r.gfx);}
}catch(e){}
S.car=clamp(S.car|0,0,CARS.length-1);S.track=clamp(S.track|0,0,TRACKS.length-1);
S.paint=clamp(S.paint|0,0,PAINTS.length-1);S.rims=clamp(S.rims|0,0,RIMS.length-1);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- global state ---------- */
const K={},TC={};
let renderer=null,scene=null,camera=null,sun=null,TK=null,wi=-1,trackG=null,decG=null;
let wMats=[],carMats=[],cars=[],TRK={P:[],N:[],H:[],C:[]};
let mode='menu',paused=false,ph='count',cdT=0,cdSt=-1,raceT=0,doneT=0,shown=false,res=null;
let career=false,raceTi=0,cam=0,camSnap=true,orbA=0,lg=1,mB=null,mk=1,mx=0,mz=0,mo=[0,0],tId=0,hT=0;
const CAMN=['CHASE','HOOD','COCKPIT','BUMPER'];
const geos={box:new THREE.BoxGeometry(1,1,1),cyl:new THREE.CylinderGeometry(1,1,1,12),cone:new THREE.ConeGeometry(1,1,10),sph:new THREE.SphereGeometry(1,12,8)};
const SHARED=Object.values(geos);
const mat=(c,o)=>{const m=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o||{}));wMats.push(m);return m;};
const cm=(c,o)=>{const m=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.4,metalness:.3},o||{}));carMats.push(m);return m;};

/* ---------- stats and upgrades ---------- */
function stats(d,L,m){L=L||{};m=m||1;return{
  acc:(12+d.a*2.2)*(1+.06*(L.engine|0))*m,
  top:(46+d.v*2.6)*(1+.03*(L.top|0))*m,
  grip:(5+d.h*.8)*(1+.07*(L.grip|0)),
  brk:(14+d.b*2.2)*(1+.08*(L.brakes|0)),
  steer:(1.6+d.h*.15)*(1+.08*(L.steer|0)),
  drag:.025,
  tMul:1.35+.05*(L.turbo|0),
  tDrain:22/(1+.1*(L.turbo|0))};}
const ucost=L=>150*(L+1);

/* ---------- graphics ---------- */
function applyG(){
  const g=S.gfx,aa=!!g.aa;
  if(!renderer||renderer.__aa!==aa){
    if(renderer){renderer.forceContextLoss();renderer.dispose();renderer.domElement.remove();}
    renderer=new THREE.WebGLRenderer({antialias:aa,powerPreference:'high-performance'});
    renderer.__aa=aa;
    $('#stage').appendChild(renderer.domElement);
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)*g.res/100);
  renderer.setSize(innerWidth,innerHeight,false);
  renderer.shadowMap.enabled=!!g.sh;
  renderer.shadowMap.type=THREE.PCFShadowMap;
  if(sun)sun.castShadow=!!g.sh;
  if(camera){camera.far=g.far?3000:1200;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
  if(scene&&scene.fog)scene.fog.far=g.far?2400:1000;
}
function preset(n){S.gfx=Object.assign({preset:n},PRE[n]);applyG();save();renderGfx();}
function gset(k){
  const g=S.gfx;
  if(k==='sound'){S.sound=S.sound==='ON'?'OFF':'ON';vol();}
  else{
    if(k==='res')g.res=g.res===50?75:g.res===75?100:50;else g[k]=g[k]?0:1;
    g.preset='CUSTOM';applyG();
  }
  save();renderGfx();
}

/* ---------- world ---------- */
function world(ti){
  if(scene)scene.traverse(o=>{if(o.geometry&&SHARED.indexOf(o.geometry)<0)o.geometry.dispose();});
  for(const m of wMats)m.dispose();
  wMats=[];
  TK=TRACKS[ti];wi=ti;const T=TK;
  const P=[];
  for(let i=0;i<MS;i++){
    const th=i/MS*Math.PI*2,r=1+T.a*Math.sin(T.k*th+T.p)+T.b*Math.sin((T.k+1)*th+T.q);
    P.push(new THREE.Vector3(Math.cos(th)*T.rx*r,0,Math.sin(th)*T.rz*r));
  }
  TRK.P=P;TRK.N=[];TRK.H=[];TRK.C=[];
  for(let i=0;i<MS;i++){
    const a=P[(i-1+MS)%MS],b=P[(i+1)%MS],tx=b.x-a.x,tz=b.z-a.z,L=Math.hypot(tx,tz)||1;
    TRK.H.push(Math.atan2(tx,tz));TRK.N.push(new THREE.Vector3(-tz/L,0,tx/L));
  }
  for(let i=0;i<MS;i++)TRK.C.push(Math.abs(wrap(TRK.H[(i+3)%MS]-TRK.H[(i-3+MS)%MS])));

  scene=new THREE.Scene();
  scene.background=new THREE.Color(T.sky);
  scene.fog=new THREE.Fog(T.fog,160,2400);
  scene.add(new THREE.HemisphereLight(T.sky,T.gnd,.9));
  sun=new THREE.DirectionalLight(0xffffff,T.env==='neon'?.5:1.05);
  const sc=sun.shadow.camera;sc.left=-170;sc.right=170;sc.top=170;sc.bottom=-170;sc.near=10;sc.far=900;sc.updateProjectionMatrix();
  sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.0006;
  scene.add(sun);scene.add(sun.target);

  const ground=new THREE.Mesh(new THREE.PlaneGeometry(8000,8000),mat(T.gnd,{roughness:1}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-.05;ground.receiveShadow=true;scene.add(ground);

  trackG=new THREE.Group();scene.add(trackG);
  const road=mat(T.road,{side:THREE.DoubleSide}),line=mat(0xf0f0f0,{side:THREE.DoubleSide}),kerb=mat(0xc92a2a,{side:THREE.DoubleSide});
  rib(-HW,HW,.01,road);rib(HW-.9,HW,.03,line);rib(-HW,-HW+.9,.03,line);rib(HW,HW+1.4,.02,kerb);rib(-HW-1.4,-HW,.02,kerb);

  const cw=2*HW/8,wh=mat(0xf4f4f4),bk=mat(0x111111);
  for(let k=0;k<8;k++){
    const q=P[0],n=TRK.N[0],o=-HW+cw*(k+.5);
    const b=new THREE.Mesh(geos.box,k%2?wh:bk);
    b.scale.set(cw,.06,2.2);b.position.set(q.x+n.x*o,.04,q.z+n.z*o);b.rotation.y=TRK.H[0];scene.add(b);
  }

  decG=new THREE.Group();scene.add(decG);
  let sd=ti*977+31;
  const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const TR=mat(0x5a3d26),LF=mat(0x2f7d3a),PN=mat(0x1f4d2b),RK=mat(0xc9d2dc,{roughness:1}),SD=mat(0xe1b77c);
  const NE=[0xff2bd6,0x2bf3ff,0xffd52b].map(c=>mat(0x12101f,{emissive:c,emissiveIntensity:.9}));
  const add=(ge,m,s3,x,y,z)=>{const o=new THREE.Mesh(ge,m);o.scale.set(s3[0],s3[1],s3[2]);o.position.set(x,y,z);decG.add(o);};
  const tree=(x,z,s,lf)=>{add(geos.cyl,TR,[.5*s,3*s,.5*s],x,1.5*s,z);add(geos.cone,lf,[2.6*s,4*s,2.6*s],x,5*s,z);};
  for(let k=0;k<(T.env==='neon'?90:140);k++){
    const i=Math.floor(rnd()*MS),o=(rnd()<.5?-1:1)*(HW+6+rnd()*(T.env==='alpine'?240:110));
    const x=P[i].x+TRK.N[i].x*o,z=P[i].z+TRK.N[i].z*o,r=rnd();
    if(T.env==='neon'){const h=30+rnd()*120;add(geos.box,NE[k%3],[18+rnd()*20,h,18+rnd()*20],x,h/2,z);}
    else if(T.env==='desert'){
      if(r<.6){const h=6+rnd()*8;add(geos.cyl,LF,[1.5,h,1.5],x,h/2,z);}
      else add(geos.sph,SD,[18+rnd()*14,3,12+rnd()*8],x,1,z);
    }
    else if(T.env==='alpine'&&r<.5){const h=100+rnd()*170;add(geos.cone,RK,[h*.8,h,h*.8],x,h/2,z);}
    else tree(x,z,.8+rnd()*1.2,T.env==='alpine'?PN:LF);
  }
  applyG();
}
function rib(a,b,y,m){
  const pos=[],idx=[],P=TRK.P,N=TRK.N;
  for(let i=0;i<MS;i++){const p=P[i],n=N[i];pos.push(p.x+n.x*a,y,p.z+n.z*a,p.x+n.x*b,y,p.z+n.z*b);}
  for(let i=0;i<MS;i++){const j=(i+1)%MS,A=2*i,B=A+1,C=2*j,D=C+1;idx.push(A,B,C,B,D,C);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();
  const o=new THREE.Mesh(g,m);o.receiveShadow=true;trackG.add(o);
}

/* ---------- cars ---------- */
function carMesh(d,p){
  const g=new THREE.Group(),w=d.s[0],h=d.s[1],l=d.s[2];
  const body=cm(p?PAINTS[S.paint]:d.c,{roughness:.25,metalness:.5}),glass=cm(0x0c1220,{roughness:.1,metalness:.8}),blk=cm(0x111111),tire=cm(0x0e0e0e,{roughness:.95}),rim=cm(RIMS[S.rims],{metalness:.9,roughness:.25});
  const lamp=cm(0xfff6d5,{emissive:0xfff6d5,emissiveIntensity:1}),tail=cm(0xff2020,{emissive:0xff2020,emissiveIntensity:1});
  const put=(ge,m,s3,x,y,z,sh)=>{const o=new THREE.Mesh(ge,m);o.scale.set(s3[0],s3[1],s3[2]);o.position.set(x,y,z);o.castShadow=sh!==0;g.add(o);};
  put(geos.box,body,[w,h,l],0,.25+h/2,0);
  put(geos.box,glass,[w*.8,h*.7,l*.42],0,.25+h*1.35,-l*.06);
  put(geos.box,blk,[w*.95,.08,.45],0,.25+h+.12,-l/2+.3);
  [-1,1].forEach(s=>{
    put(geos.box,lamp,[w*.25,.14,.06],s*w*.3,.25+h*.6,l/2+.02,0);
    put(geos.box,tail,[w*.22,.12,.06],s*w*.3,.25+h*.6,-l/2-.02,0);
  });
  const spins=[];
  [[-1,1],[1,1],[-1,-1],[1,-1]].forEach(([sx,sz])=>{
    const wg=new THREE.Group();wg.rotation.z=Math.PI/2;wg.position.set(sx*(w/2+.12),.5,sz*l*.33);g.add(wg);
    const sp=new THREE.Group();wg.add(sp);spins.push(sp);
    const t=new THREE.Mesh(geos.cyl,tire);t.scale.set(.45,.42,.45);t.castShadow=true;sp.add(t);
    const r=new THREE.Mesh(geos.cyl,rim);r.scale.set(.27,.44,.27);sp.add(r);
  });
  g.userData.spins=spins;
  return g;
}
function resetCars(){
  for(const c of cars)if(c.mesh.parent)c.mesh.parent.remove(c.mesh);
  for(const m of carMats)m.dispose();
  carMats=[];cars=[];
  const list=[CARS[S.car]];
  for(let i=0;i<3;i++)list.push(CARS[(S.car+1+2*i)%CARS.length]);
  const back=[6,6,15,15];
  list.forEach((d,i)=>{
    const p=i===0,mul=p?1:.97+Math.random()*.03;
    const idx=(MS-back[i])%MS,sd=i%2?3:-3;
    const c={d,p,s:stats(d,p?S.up:null,mul),mesh:carMesh(d,p),x:0,z:0,h:TRK.H[idx],v:0,u:0,st:0,tb:100,boost:false,wb:false,hb:false,thr:0,idx,lastIdx:idx,prog:-back[i],sec:-1,skill:p?1:.9+Math.random()*.1,lane:p?0:(Math.random()*2-1)*3.5};
    c.x=TRK.P[idx].x+TRK.N[idx].x*sd;c.z=TRK.P[idx].z+TRK.N[idx].z*sd;
    scene.add(c.mesh);cars.push(c);
  });
  sync(0);
}
function sync(dt){
  for(const c of cars){
    const m=c.mesh;
    m.position.set(c.x,0,c.z);
    m.rotation.set(0,c.h,clamp(-c.u*.012,-.08,.08));
    const sp=c.v*dt/.45;
    for(const s of m.userData.spins)s.rotation.y+=sp;
  }
}

/* ---------- physics ---------- */
function drive(c,dt,I,fr){
  const s=c.s,sp=Math.abs(c.v),gas=!fr&&!!I.gas,brk=fr||!!I.brake;
  c.boost=!fr&&!!I.turbo&&gas&&c.tb>1;
  c.tb=c.boost?Math.max(0,c.tb-s.tDrain*dt):Math.min(100,c.tb+9*dt);
  const top=s.top*(c.boost?1.1:1),x=c.v/top;
  c.thr=gas?1:0;
  if(gas)c.v+=s.acc*(c.boost?s.tMul:1)*(1-x*x)*dt;
  if(fr)c.v=Math.max(0,c.v-s.brk*dt);
  else if(brk)c.v=c.v>.5?Math.max(0,c.v-s.brk*dt):Math.max(-12,c.v-4*dt);
  c.v-=s.drag*c.v*dt;
  const tg=fr?0:clamp(I.steer||0,-1,1);
  c.st+=(tg-c.st)*Math.min(1,dt*6);
  c.hb=!fr&&!!I.hand&&sp>3;
  const yaw=c.st*s.steer*Math.min(1,sp/25)*(1-.3*Math.min(1,sp/top));
  c.h+=yaw*dt;
  if(c.hb){c.v*=1-Math.min(.9,.6*dt);c.h+=c.st*.5*dt*Math.min(1,sp/20);}
  const gr=s.grip*(c.hb?.3:1);
  c.u+=yaw*c.v*.55*dt;
  c.u*=Math.exp(-gr*dt);
  const fx=Math.sin(c.h),fz=Math.cos(c.h);
  c.x+=(fx*c.v-fz*c.u)*dt;
  c.z+=(fz*c.v+fx*c.u)*dt;
}
function ai(c){
  const L=Math.round(5+Math.abs(c.v)*.1),ti=(c.idx+L)%MS,n=TRK.N[ti],P=TRK.P[ti];
  const tx=P.x+n.x*c.lane,tz=P.z+n.z*c.lane;
  let mc=0;
  for(let k=0;k<30;k+=3)mc=Math.max(mc,TRK.C[(c.idx+k)%MS]);
  const tv=c.s.top*c.skill*(1-Math.min(.45,mc*1.4));
  const st=clamp(wrap(Math.atan2(tx-c.x,tz-c.z)-c.h)*2.4,-1,1);
  return{gas:c.v<tv-1,brake:c.v>tv+2,steer:st};
}
function near(x,z){
  let b=1e18,bi=0;const P=TRK.P;
  for(let i=0;i<MS;i++){const dx=P[i].x-x,dz=P[i].z-z,d=dx*dx+dz*dz;if(d<b){b=d;bi=i;}}
  return[bi,Math.sqrt(b)];
}
function collide(){
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){
    const a=cars[i],b=cars[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    if(d<4.3&&d>.001){
      const o=(4.3-d)/2,nx=dx/d,nz=dz/d;
      a.x-=nx*o;a.z-=nz*o;b.x+=nx*o;b.z+=nz*o;
      const now=performance.now();
      if(Math.abs(a.v-b.v)>5&&now-hT>250){hT=now;burst(.2,900,.2);}
      a.v*=.985;b.v*=.985;
    }
  }
}
function rank(){const pp=cars[0].prog;let r=1;for(const c of cars)if(c.prog>pp)r++;return r;}
function inp(){const g=k=>!!(K[k]||TC[k]);return{gas:g('gas'),brake:g('brake'),hand:g('hand'),turbo:g('turbo'),steer:(g('left')?1:0)-(g('right')?1:0)};}

function step(dt){
  const p=cars[0];
  if(ph==='count'){
    cdT+=dt;
    const st=Math.min(2,Math.floor(cdT));
    if(st!==cdSt&&cdT<3){cdSt=st;blip(660,.14,.12);}
    if(cdT>=3){ph='run';cdSt=-1;blip(990,.35,.14);}
  }
  const fr=ph!=='run';
  if(ph==='run')raceT+=dt;
  if(ph==='done')doneT+=dt;
  const I=inp();
  for(const c of cars)drive(c,dt,c.p?I:ai(c),fr);
  collide();
  for(const c of cars){
    const r=near(c.x,c.z),ni=r[0],d=r[1];
    let di=ni-c.lastIdx;
    if(di<-MS/2)di+=MS;else if(di>MS/2)di-=MS;
    c.prog+=di;c.lastIdx=ni;c.idx=ni;
    if(d>HW+.8)c.v*=1-Math.min(1,dt*1.2);
    if(d>HW+4){const q=TRK.P[ni],k=(HW+4)/d;c.x=q.x+(c.x-q.x)*k;c.z=q.z+(c.z-q.z)*k;c.v*=.985;c.u*=-.4;}
  }
  const sec=Math.floor((((p.prog%MS)+MS)%MS)/(MS/3));
  if(p.sec>=0&&sec!==p.sec&&ph==='run')toast('CHECKPOINT '+(sec+1)+'  '+fmt(raceT));
  p.sec=sec;
  if(p.boost&&!p.wb)burst(.5,1400,.14);
  p.wb=p.boost;
  if(ph==='run'&&p.prog>=LAPS*MS){
    ph='done';doneT=0;
    const pos=rank(),prize=PRIZES[pos-1]||0;
    S.credits+=prize;
    if(pos===1){S.wins++;if(career)S.career++;}
    save();
    res={pos,prize,time:raceT,win:pos===1};
  }
  if(ph==='done'&&doneT>1.6&&!shown){shown=true;paused=true;showRes();}
}

/* ---------- audio ---------- */
let AC=null,M=null,eng=null,eG=null,tG=null,cG=null,nb=null;
function aud(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    M=AC.createGain();M.connect(AC.destination);vol();
    nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    eng=AC.createOscillator();eng.type='sawtooth';
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;
    eG=AC.createGain();eG.gain.value=0;eng.connect(lp);lp.connect(eG);eG.connect(M);eng.start();
    tG=AC.createGain();tG.gain.value=0;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2400;bp.Q.value=3;
    const ts=AC.createBufferSource();ts.buffer=nb;ts.loop=true;ts.connect(bp);bp.connect(tG);tG.connect(M);ts.start();
    cG=AC.createGain();cG.gain.value=0;
    const lf=AC.createBiquadFilter();lf.type='lowpass';lf.frequency.value=500;
    const cs=AC.createBufferSource();cs.buffer=nb;cs.loop=true;cs.connect(lf);lf.connect(cG);cG.connect(M);cs.start();
  }catch(e){AC=null;}
}
function vol(){if(M)M.gain.value=S.sound==='ON'?.5:0;}
function blip(f,dur,v){
  if(!AC||!M)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='square';o.frequency.value=f;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(M);o.start(t);o.stop(t+dur+.02);
}
function burst(dur,hp,v){
  if(!AC||!M||!nb)return;
  const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=nb;f.type='highpass';f.frequency.value=hp;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(M);
  s.start(t,Math.random());s.stop(t+dur+.02);
}
function audFrame(){
  if(!AC||!eng)return;
  const p=cars[0],t=AC.currentTime,sp=Math.abs(p.v),x=clamp(sp/p.s.top,0,1),live=mode==='race'&&!paused;
  eng.frequency.setTargetAtTime(60+x*200+(p.boost?60:0),t,.05);
  eG.gain.setTargetAtTime(live?.03+.05*p.thr+.02*x:0,t,.08);
  const sl=(p.hb&&sp>8)||(Math.abs(p.u)>2.2&&sp>10);
  tG.gain.setTargetAtTime(live&&sl?.08:0,t,.05);
  cG.gain.setTargetAtTime(mode==='race'?.035:0,t,.6);
}
const BASS=[110,110,146.8,130.8,110,164.8,146.8,130.8];
let mS=0;
setInterval(()=>{
  if(!AC||!M||mode!=='race'||paused||ph==='done')return;
  const n=mS++;
  blip(BASS[n%8],.2,.035);
  if(n%2===0)burst(.04,5000,.03);
},250);

/* ---------- camera, minimap, HUD ---------- */
const TP=new THREE.Vector3(),TL=new THREE.Vector3(),CL=new THREE.Vector3();
function sunF(x,z){if(!sun)return;sun.target.position.set(x,0,z);sun.position.set(x+150,260,z+90);}
function camUp(dt){
  if(mode!=='race'){
    if(cars[0])cars[0].mesh.visible=true;
    orbA+=dt*.12;
    camera.position.set(Math.cos(orbA)*560,260,Math.sin(orbA)*560);
    camera.fov=50;camera.updateProjectionMatrix();camera.lookAt(0,0,0);
    sunF(0,0);return;
  }
  const p=cars[0],fx=Math.sin(p.h),fz=Math.cos(p.h),sp=Math.abs(p.v);
  let o,l,fov;
  if(cam===0){o=[-fx*9.5,4.2,-fz*9.5];l=[fx*8,1.1,fz*8];fov=64+Math.min(18,sp*.12);}
  else if(cam===1){o=[fx*1.4,1.7,fz*1.4];l=[fx*30,1,fz*30];fov=70;}
  else if(cam===2){o=[fx*.35,1.25,fz*.35];l=[fx*30,.9,fz*30];fov=72;}
  else{o=[fx*2.7,.6,fz*2.7];l=[fx*30,.3,fz*30];fov=74;}
  TP.set(p.x+o[0],o[1],p.z+o[2]);TL.set(p.x+l[0],l[1],p.z+l[2]);
  if(camSnap){camera.position.copy(TP);CL.copy(TL);camSnap=false;}
  else{const k=1-Math.exp(-(cam===0?7:16)*dt);camera.position.lerp(TP,k);CL.lerp(TL,k);}
  camera.fov+=(fov-camera.fov)*Math.min(1,dt*4);
  camera.updateProjectionMatrix();camera.lookAt(CL);
  p.mesh.visible=cam!==2;
  sunF(p.x,p.z);
}
function miniBuild(){
  const P=TRK.P;let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  for(const p of P){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);z0=Math.min(z0,p.z);z1=Math.max(z1,p.z);}
  const W=170,pad=12;
  mk=(W-2*pad)/Math.max(x1-x0,z1-z0);mx=x0;mz=z0;
  mo=[pad+(W-2*pad-(x1-x0)*mk)/2,pad+(W-2*pad-(z1-z0)*mk)/2];
  mB=document.createElement('canvas');mB.width=W;mB.height=W;
  const g=mB.getContext('2d');
  g.strokeStyle='#c9d0da';g.lineWidth=4;g.lineJoin='round';g.beginPath();
  P.forEach((p,i)=>{const X=mo[0]+(p.x-mx)*mk,Y=mo[1]+(p.z-mz)*mk;if(i)g.lineTo(X,Y);else g.moveTo(X,Y);});
  g.closePath();g.stroke();
}
function miniDraw(){
  const cv=$('#mini');if(!cv||!mB)return;
  const g=cv.getContext('2d');
  g.clearRect(0,0,170,170);g.drawImage(mB,0,0);
  cars.forEach((c,i)=>{
    g.fillStyle=i===0?'#ff5a1f':'#9aa3af';
    g.beginPath();g.arc(mo[0]+(c.x-mx)*mk,mo[1]+(c.z-mz)*mk,i?3.5:5,0,Math.PI*2);g.fill();
  });
}
function toast(t){
  const el=$('#toast');el.textContent=t;el.classList.add('show');
  clearTimeout(tId);tId=setTimeout(()=>el.classList.remove('show'),1400);
}
function hud(){

  set('#hPos',rank()+'/'+cars.length);

  set('#hTime',fmt(raceT));
  const k=Math.round(Math.abs(p.v)*3.6);
  set('#kmh',k);
  const g=Math.min(6,1+Math.floor(k/38));
  if(g!==lg){lg=g;burst(.05,2200,.06);}
  set('#gear',g);

  let c='';

}

let last=performance.now(),errShown=false;
function loop(now){
  requestAnimationFrame(loop);
  const dt=clamp((now-last)/1000,0,.05);last=now;
  try{
    if(mode==='race'&&!paused)step(dt);
    camUp(dt);
    sync(dt);
    audFrame();
    if(mode==='race'){hud();miniDraw();}
    renderer.render(scene,camera);
  }catch(e){
    if(!errShown){errShown=true;console.error(e);toast('Error: '+e.message);}
  }
}

try{
  camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.5,3000);
  applyG();
  world(S.track);
  resetCars();
  showView('menu');
  requestAnimationFrame(loop);
}catch(e){
  console.error(e);
  document.body.insertAdjacentHTML('beforeend','<p style="position:fixed;left:16px;bottom:16px;color:#ff5a1f">WebGL tidak tersedia di browser ini. Coba browser lain.</p>');
}
})();
</script>
